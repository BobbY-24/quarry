[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "packaging==26.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry"
version = "6.6.0"
description = "Quarry: recipe-driven, evidence-backed research collection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pypdf==6.19.0", "pyarrow==25.0.1"]
license = "MIT"

[project.urls]
Repository = "https://github.com/BobbY-24/quarry"
Documentation = "https://github.com/BobbY-24/quarry/blob/main/README.md"

[project.scripts]
quarry = "quarry.cli:main"
quarry-mcp = "quarry.mcp_server:main"
termfinder = "quarry.cli:main"
termfinder-mcp = "quarry.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quarry = ["recipes/*.json", "profiles/*.json", "fixtures/*", "static/*", "schemas/*.json", "agent_skill/*", "agent_skill/references/*"]
